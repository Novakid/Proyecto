<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: #e2e8f0;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 80%;
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
      font-weight: 500;
    }

    .progress-bar {
      width: 100%;
      height: 12px;
      background: #1e293b;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #22c55e, #4ade80);
      transition: width 0.3s ease;
    }

    .percent {
      margin-top: 10px;
      font-size: 14px;
      color: #94a3b8;
    }

    .error {
      display: none;
      margin-top: 16px;
      color: #fca5a5;
      font-size: 14px;
    }

    .close-button {
      display: none;
      margin: 16px auto 0;
      padding: 8px 16px;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Cargando el programa...</h2>

    <div class="progress-bar">
      <div id="progress" class="progress"></div>
    </div>

    <div id="percent" class="percent">0%</div>
    <div id="error" class="error" role="alert"></div>
    <button id="close-button" class="close-button" type="button">Cerrar aplicacion</button>
  </div>

  <script>
    const bar = document.getElementById('progress');
    const percent = document.getElementById('percent');
    const errorMessage = document.getElementById('error');
    const closeButton = document.getElementById('close-button');

    const removeProgressListener = window.splashAPI.onProgress((value) => {
      const progress = Math.max(0, Math.min(100, Number(value) || 0));
      bar.style.width = progress + '%';
      percent.textContent = progress + '%';
    });

    const removeErrorListener = window.splashAPI.onError((message) => {
      errorMessage.textContent = String(message);
      errorMessage.style.display = 'block';
      closeButton.style.display = 'block';
    });

    closeButton.addEventListener('click', () => window.splashAPI.quit());
    window.addEventListener('beforeunload', () => {
      removeProgressListener();
      removeErrorListener();
    });
  </script>
</body>
</html>
